<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tatuagem Surpresa - Pegadinha</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-2xl border border-slate-700">
    <h1 class="text-2xl font-bold text-center text-amber-400 mb-1">🔥 Pegadinha da Tatuagem</h1>
    <p class="text-xs text-slate-400 text-center mb-6">Crie uma trollagem com vídeo personalizado!</p>

    <!-- FORMULÁRIO -->
    <form id="tattooForm" class="space-y-4">
      <div>
        <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Seu Nome (Ombro da Mulher)</label>
        <input type="text" id="seuNome" required maxlength="12" placeholder="Ex: Juliana" 
               class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400">
      </div>

      <div>
        <label class="block text-xs uppercase font-semibold text-slate-400 mb-1">Nome do Amigo (Costas do Paulão)</label>
        <input type="text" id="nomeAmigo" required maxlength="12" placeholder="Ex: Carlos" 
               class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400">
      </div>

      <button type="submit" id="btnSubmit" 
              class="w-full bg-amber-500 hover:bg-amber-600 font-bold py-3 px-4 rounded-lg text-slate-950 transition duration-200">
        Gerar Pegadinha por R$ 4,90 🚀
      </button>
    </form>

    <!-- ÁREA DO PIX (Invisível até acionar o form) -->
    <div id="pixArea" class="hidden mt-6 text-center border-t border-slate-700 pt-6">
      <h3 class="text-lg font-bold text-green-400">Escaneie o PIX para Liberar</h3>
      <p class="text-xs text-slate-400 my-2">O vídeo será processado assim que o pagamento for confirmado.</p>
      
      <img id="qrCodeImg" class="w-48 h-48 mx-auto my-4 rounded-lg border border-slate-600" src="" alt="QR Code PIX">
      
      <button id="btnCopyPix" class="w-full bg-slate-700 hover:bg-slate-600 text-sm py-2 rounded-lg font-semibold mb-2">
        Copiar Chave PIX Copia e Cola
      </button>
      
      <p id="statusPayment" class="text-xs text-amber-400 animate-pulse mt-3">Aguardando confirmação do pagamento...</p>
    </div>

    <!-- ÁREA DO VÍDEO FINAL -->
    <div id="videoArea" class="hidden mt-6 text-center border-t border-slate-700 pt-6">
      <h3 class="text-lg font-bold text-green-400 mb-2">🎉 Seu vídeo está pronto!</h3>
      <a id="btnDownload" href="" target="_blank" download="pegadinha.mp4" 
         class="inline-block w-full bg-green-500 hover:bg-green-600 text-slate-950 font-bold py-3 rounded-lg">
        Baixar Vídeo / Enviar no WhatsApp
      </a>
    </div>

  </div>

  <script>
    let pixCopiaCola = "";
    let seuNomeVar = "";
    let nomeAmigoVar = "";

    document.getElementById('tattooForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      seuNomeVar = document.getElementById('seuNome').value;
      nomeAmigoVar = document.getElementById('nomeAmigo').value;

      document.getElementById('btnSubmit').disabled = true;
      document.getElementById('btnSubmit').innerText = "Gerando cobrança PIX...";

      const res = await fetch('/api/create-pix', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seuNome: seuNomeVar, nomeAmigo: nomeAmigoVar })
      });

      const data = await res.json();

      if(data.success) {
        document.getElementById('qrCodeImg').src = `data:image/png;base64,${data.encodedImage}`;
        pixCopiaCola = data.payload;

        document.getElementById('tattooForm').classList.add('hidden');
        document.getElementById('pixArea').classList.remove('hidden');

        // Checa se o PIX foi pago a cada 4 segundos
        checkPaymentStatus(data.paymentId);
      }
    });

    document.getElementById('btnCopyPix').addEventListener('click', () => {
      navigator.clipboard.writeText(pixCopiaCola);
      alert('Chave PIX copiada!');
    });

    function checkPaymentStatus(paymentId) {
      const interval = setInterval(async () => {
        const res = await fetch(`/api/check-payment?paymentId=${paymentId}`);
        const data = await res.json();

        if (data.status === 'RECEIVED' || data.status === 'CONFIRMED') {
          clearInterval(interval);
          document.getElementById('statusPayment').innerText = "✅ PIX Pago! Aplicando tatuagem no vídeo...";
          
          // Chama a API do Shotstack para criar o vídeo
          generateVideo();
        }
      }, 4000);
    }

    async function generateVideo() {
      const res = await fetch('/api/render-video', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seuNome: seuNomeVar, nomeAmigo: nomeAmigoVar })
      });

      const data = await res.json();
      
      if(data.videoUrl) {
        document.getElementById('pixArea').classList.add('hidden');
        document.getElementById('videoArea').classList.remove('hidden');
        document.getElementById('btnDownload').href = data.videoUrl;
      }
    }
  </script>
</body>
</html>
