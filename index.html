<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Herr+Von+Muellerhoff&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pegadinha da Tatuagem 🔥</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f0f12; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .container { width: 100%; max-width: 420px; background: #1a1a24; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
    h1 { font-size: 22px; margin-bottom: 8px; color: #ff2a8d; }
    p.sub { font-size: 14px; color: #a0a0b0; margin-bottom: 20px; }

    label { display: block; text-align: left; font-size: 13px; margin: 12px 0 4px; color: #ccc; font-weight: bold; }
    input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #333; background: #0f0f12; color: #fff; font-size: 15px; outline: none; }
    input:focus { border-color: #ff2a8d; }

    .btn-main { width: 100%; padding: 16px; margin-top: 20px; background: linear-gradient(135deg, #ff2a8d, #ff5e62); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: transform 0.2s; }
    .btn-main:hover { transform: scale(1.02); }

    /* Área do Vídeo + Tatuagem */
    .video-wrapper { position: relative; width: 100%; max-width: 420px; margin-top: 20px; display: none; border-radius: 12px; overflow: hidden; }
    video { width: 100%; display: block; border-radius: 12px; }

    /* Estilo Base e Fusão com a Pele (ATUALIZE ESTE BLOCO) */
.tattoo-overlay {
  position: absolute;
  font-family: 'Herr Von Muellerhoff', cursive; /* Nova fonte cursiva bem realista */
  font-size: 19px; /* Aumente o tamanho para a nova fonte ser legível */
  display: none;
  pointer-events: none;
  z-index: 10;
  
  /* MÁGICA DO REALISMO: Funde a tinta com a pele */
  mix-blend-mode: multiply; 
  
  /* Sombra leve para simular profundidade na pele */
  text-shadow: 0.5px 0.5px 1px rgba(0,0,0,0.3); 
  
  /* Suaviza as bordas da fonte (Anti-aliasing) */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

    /* Posição na Garota (AJUSTE top/left conforme o seu vídeo real) */
#tattoo-garota {
  top: 65%; /* Exemplo: Ajuste ligeiramente para baixo */
  left: 47%; /* Exemplo: Ajuste ligeiramente para a direita */
  
  /* Cor "Tinta de Tatuagem": Um preto não puro (levemente azulado/acinzentado) */
  color: #1a2a35; 
  
  font-weight: 400; /* Não use negrito (bold) para realismo */
  transform: rotate(-10deg); /* Incline mais para acompanhar o osso da clavícula */
  opacity: 0.9; /* Deixe ligeiramente transparente */
}

/* Posição no Paulão (Ajuste top/left conforme o seu vídeo real) */
#tattoo-paulao {
  top: 60%;
  left: 52%;
  
  /* No Paulão, pode ser um preto mais forte ou o tom que preferir */
  color: #111111; 
  
  font-weight: 400;
  transform: rotate(-8deg); /* Acompanhando a musculatura */
  opacity: 0.95;
}

    /* Modal Pix */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
    .modal-box { background: #1a1a24; padding: 25px; border-radius: 16px; max-width: 360px; width: 90%; text-align: center; border: 1px solid #333; }
    .qr-container { background: #fff; padding: 10px; border-radius: 8px; margin: 15px auto; display: inline-block; }
    .qr-container img { width: 180px; height: 180px; display: block; }
  </style>
</head>
<body>

  <div class="container" id="box-form">
    <h1>🔥 Pegadinha da Tatuagem</h1>
    <p class="sub">Faça seu amigo achar que virou tatuagem na clavícula!</p>

    <label>SEU NOME (Tatuagem na Loira):</label>
    <input type="text" id="nomeGarota" placeholder="Ex: Lucas" maxlength="15">

    <label>NOME DO AMIGO ZOADO (Tatuagem no Paulão):</label>
    <input type="text" id="nomeAmigo" placeholder="Ex: Marquinhos" maxlength="15">

    <button class="btn-main" onclick="iniciarPegadinha()">🚀 GERAR VÍDEO AGORA</button>
  </div>

  <!-- Player e Camadas de Tatuagem -->
  <div class="video-wrapper" id="box-video">
    <video id="meuVideo" playsinline>
      <!-- COLE SUA URL DO CLOUDFLARE R2 AQUI ABAIXO -->
      <source src="https://pub-a88b95b95b904bf9aea3128a18669af9.r2.dev/Generated%20Video%20July%2027%2C%202026%20-%206_47PM.mp4" type="video/mp4">
    </video>
    
    <div id="tattoo-garota" class="tattoo-overlay"></div>
    <div id="tattoo-paulao" class="tattoo-overlay"></div>
  </div>

  <!-- Modal do PIX -->
  <div class="modal" id="modalPix">
    <div class="modal-box">
      <h2 style="color: #ff2a8d; font-size: 20px;">🔒 Libere o Vídeo sem Marca D'água</h2>
      <p style="font-size: 13px; color: #ccc; margin-top: 5px;">Pague via PIX para enviar direto no WhatsApp do seu amigo!</p>
      
      <div class="qr-container" id="qr-code-area">
        <p style="color: #000; font-size: 12px;">Gerando PIX...</p>
      </div>

      <p style="font-size: 14px; font-weight: bold; color: #4caf50;">Valor: R$ 4,90</p>
      <button class="btn-main" style="margin-top: 10px;" onclick="copiarPix()">📋 COPIAR CÓDIGO PIX</button>
    </div>
  </div>

 <script>
  let codePixCopiaECola = "";
  let paymentID = "";
  let checarPagamentoInterval = null;

  function iniciarPegadinha() {
    const g = document.getElementById('nomeGarota').value.trim() || "Amor";
    const a = document.getElementById('nomeAmigo').value.trim() || "Neném";

    // Insere os nomes com os símbolos
    document.getElementById('tattoo-garota').innerHTML = g + " ♥";
    document.getElementById('tattoo-paulao').innerHTML = "💘 " + a;

    document.getElementById('box-form').style.display = 'none';
    document.getElementById('box-video').style.display = 'block';

    const video = document.getElementById('meuVideo');
    video.currentTime = 0;

    var playPromise = video.play();
    if (playPromise !== undefined) {
      playPromise.catch(function(error) {
        console.log("Autoplay barrado pelo navegador:", error);
        video.muted = true;
        video.play();
      });
    }

    // Sincronização dos tempos no vídeo
    video.ontimeupdate = function() {
      const t = video.currentTime;

      if (t >= 0.0 && t < 4.29) {
        document.getElementById('tattoo-garota').style.display = 'block';
        document.getElementById('tattoo-paulao').style.display = 'none';
      } else if (t >= 4.29) {
        document.getElementById('tattoo-garota').style.display = 'none';
        document.getElementById('tattoo-paulao').style.display = 'block';
      } else {
        document.getElementById('tattoo-garota').style.display = 'none';
        document.getElementById('tattoo-paulao').style.display = 'none';
      }
    };

    // Quando o vídeo termina, dispara o modal do Pix
    video.onended = function() {
      gerarCobrancaPix();
    };
  }

  // Gera a cobrança no Asaas
  async function gerarCobrancaPix() {
    document.getElementById('modalPix').style.display = 'flex';
    
    try {
      const response = await fetch('/api/criar-pix', { method: 'POST' });
      const data = await response.json();

      codePixCopiaECola = data.pixCode;
      paymentID = data.paymentId;

      document.getElementById('qr-code-area').innerHTML = '<img src="data:image/jpeg;base64,' + data.qrCodeBase64 + '" style="width: 180px; height: 180px;" />';
      
      monitorarPagamento();

    } catch (err) {
      alert("Erro ao gerar PIX. Tente novamente.");
    }
  }

  // Copia o código PIX
  function copiarPix() {
    if (codePixCopiaECola) {
      navigator.clipboard.writeText(codePixCopiaECola);
      alert("Código PIX copiado com sucesso! Abra o app do seu banco e pague na opção Pix Copia e Cola.");
    }
  }

  // Checa se o Pix foi pago sem atualizar a página
  function monitorarPagamento() {
    checarPagamentoInterval = setInterval(async () => {
      if (!paymentID) return;

      try {
        const res = await fetch('/api/status-pagamento?id=' + paymentID);
        const data = await res.json();

        if (data.pago) {
          clearInterval(checarPagamentoInterval);

          const nomeAmigo = document.getElementById('nomeAmigo').value || "Mano";
          const linkDoSeuSite = window.location.href;

          // Texto sem quebras de template para evitar o erro de 'Missing }'
          const textoZap = "Mano, olha essa garota no estúdio de tatuagem com o seu nome (" + nomeAmigo + ") kkkkkkkkk 😂🔥\n\nCrie o seu também aqui: " + linkDoSeuSite;
          
          alert("🎉 Pagamento Aprovado! Redirecionando para o WhatsApp...");

          window.location.href = "https://api.whatsapp.com/send?text=" + encodeURIComponent(textoZap);
        }
      } catch (e) {
        console.log("Aguardando pagamento...");
      }
    }, 3000);
  }
</script>
</body>
</html>
